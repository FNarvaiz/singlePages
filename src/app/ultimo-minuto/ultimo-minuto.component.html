@if (tarjetas.length > 0) {
<section class="ultimo-minuto">
  <p class="title-39 oferta-seccion">ÚLTIMO MINUTO</p>
  <p class="oferta-titulo">¡Ofertas imperdibles!</p>

  <div class="ofertas-list">
    @for (tarjeta of tarjetas; track tarjeta.tipo + tarjeta.checkIn) {
    <a class="oferta-bar" [href]="whatsappLink(tarjeta)" target="_blank" rel="noopener">
      <span class="oferta-tipo">{{ tarjeta.tipo }}</span>

      <span class="oferta-fechas">
        <i class="fas fa-sign-in-alt"></i>
        <span>{{ tarjeta.checkIn }}</span>
        <i class="fas fa-arrow-right"></i>
        <i class="fas fa-sign-out-alt"></i>
        <span>{{ tarjeta.checkOut }}</span>
      </span>

      @if (tarjeta.info) {
      <span class="oferta-info">{{ tarjeta.info }}</span>
      }

      <span class="oferta-precio">{{ formatoPrecio(tarjeta.precio) }}</span>

      <span class="oferta-wa">
        <i class="fab fa-whatsapp"></i>
      </span>
    </a>
    }
  </div>
</section>
}
