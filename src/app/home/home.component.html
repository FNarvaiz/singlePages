<div class="home-container">
  <header class="logo-header">
    <img src="assets/home/lugra.svg" alt="Hotel Lugra Miramar" class="logo" />
    <div class="logo-divider"></div>
    <img src="assets/home/luis_protti.svg" alt="Luis Protti Inmobiliaria" class="logo" />
  </header>

  <main class="main-section" style="background-image: url('assets/home/fondo.jpg')">
    <div class="card-grid">
      @for(item of cards; track item) {
        <div class="card">
          <img [src]="item.image" [alt]="item.title" class="card-img" />
          <div class="card-body">
            <p class="card-subtitulo">{{ item.subtitulo }}</p>
            <h2 class="card-titulo">{{ item.title }}</h2>
            <button class="btn-reservas" (click)="onReservar(item.link)">Reservas</button>
          </div>
        </div>
      }
    </div>
  </main>

  <footer class="footer">
    <p>Copyright 2027. Todos los derechos reservados.<br />Lugra Hotel Miramar / Luis Protti Inmobiliaria</p>
  </footer>
</div>
